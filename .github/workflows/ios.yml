name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    env:
      SCHEME: Zenko
      PROJECT: Zenko.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve iPhone simulator
        id: sim
        run: |
          DESTINATION=$(
            xcrun simctl list devices available \
              | grep -E 'iPhone 1[6-9]' \
              | head -1 \
              | sed -E 's/.*\(([A-F0-9-]+)\).*/platform=iOS Simulator,id=\1/'
          )
          if [ -z "$DESTINATION" ]; then
            DESTINATION="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "Using destination: $DESTINATION"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quieter

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:ZenkoTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quieter

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-logs
          path: ${{ runner.temp }}/DerivedData/Logs
          retention-days: 7
